<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Palette Generator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">palette<span>.</span></div>
    <p class="hint">스페이스바를 눌러 팔레트를 생성하세요!</p>
    <div class="controls">
      <label class="mode">
        <span class="sr-only">스킴 모드</span>
        <select id="mode">
          <option value="analogic">Analogic</option>
          <option value="monochrome">Monochrome</option>
          <option value="monochrome-dark">Monochrome Dark</option>
          <option value="monochrome-light">Monochrome Light</option>
          <option value="complement">Complementary</option>
          <option value="analogic-complement">Analogic Complement</option>
          <option value="triad">Triad</option>
          <option value="quad">Quad</option>
        </select>
      </label>
      <button id="generate" class="btn" type="button">생성</button>
    </div>
  </header>

  <main id="palette" class="palette" aria-live="polite"></main>

  <div id="toast" class="toast" role="status"></div>

  <script src="js/api.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
